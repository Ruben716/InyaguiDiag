# Compilacion de InyaguiDiag en CI.
#
# POR QUE EXISTE ESTE ARCHIVO
# ---------------------------
# SignPath Foundation --que firma gratis los proyectos de codigo abierto--
# NO firma binarios compilados en la maquina de nadie. Solo firma
# artefactos producidos por un servicio de integracion continua, porque lo
# que garantiza su firma es que el binario salio del codigo publico y no
# de la carpeta de alguien.
#
# Sin este flujo no hay firma, y sin firma Smart App Control bloquea el
# ejecutable en cualquier Windows 11 con instalacion limpia.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python 3.8
        # Se instala desde el paquete nuget oficial de la PSF y no con
        # actions/setup-python porque 3.8 esta fuera de soporte y su
        # disponibilidad en los runners ya no esta garantizada. El paquete
        # nuget es el mismo que documenta docs/AUDITORIA-DEPENDENCIAS.md.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($p in @(@{n="python";    d="py38-x64"},
                           @{n="pythonx86"; d="py38-x86"})) {
            $url = "https://api.nuget.org/v3-flatcontainer/$($p.n)/3.8.10/$($p.n).3.8.10.nupkg"
            Invoke-WebRequest -Uri $url -OutFile "$($p.n).zip"
            Expand-Archive "$($p.n).zip" -DestinationPath ".toolchain\$($p.d)"
          }
          .\.toolchain\py38-x64\tools\python.exe --version
          .\.toolchain\py38-x86\tools\python.exe --version

      - name: Instalar dependencias
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($d in @("py38-x64", "py38-x86")) {
            $py = ".\.toolchain\$d\tools\python.exe"
            & $py -m ensurepip --upgrade
            & $py -m pip install -r requirements.txt -c constraints-py38.txt --quiet
            & $py -m pip install "pyinstaller==5.13.2" "pytest<8" --quiet
          }

      - name: Pruebas (x64 y x86)
        shell: pwsh
        env:
          PYTHONPATH: src
        run: |
          $ErrorActionPreference = "Stop"
          .\.toolchain\py38-x64\tools\python.exe -m pytest tests -q
          .\.toolchain\py38-x86\tools\python.exe -m pytest tests -q

      - name: Compilar
        shell: pwsh
        env:
          PYTHONPATH: src
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($a in @(@{d="py38-x64"; o="x64"}, @{d="py38-x86"; o="x86"})) {
            & ".\.toolchain\$($a.d)\tools\python.exe" -m PyInstaller `
              build\inyaguidiag.spec --distpath "dist\$($a.o)" `
              --workpath "build\tmp\$($a.o)" --noconfirm
          }

      - name: Verificar el binario compilado
        # LA comprobacion critica del proyecto. El registro de reglas se
        # llena por descubrimiento dinamico, que PyInstaller no ve: si el
        # .spec queda incompleto el .exe se construye SIN ERRORES, carga
        # cero reglas y declara sano cualquier equipo. Ver docs/USB.md.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = & dist\x64\InyaguiDiag.exe --list-checks | Out-String
          $reglas = ([regex]::Matches($out, '(?m)^\s{2}[A-Z]{3}-\d{3}')).Count
          Write-Host "reglas en el binario: $reglas"
          if ($reglas -lt 15) {
            Write-Error "El ejecutable no cargo las reglas. Revisa hiddenimports en build\inyaguidiag.spec"
            exit 1
          }

      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          # SignPath toma el artefacto por este nombre. Cambiarlo obliga a
          # actualizar tambien la configuracion del proyecto en SignPath.
          name: inyaguidiag-binaries
          path: |
            dist/x64/InyaguiDiag.exe
            dist/x86/InyaguiDiag.exe
          if-no-files-found: error
          retention-days: 30

  firmar:
    # Solo en etiquetas de version: SignPath tiene cuota y no tiene sentido
    # gastar una firma en cada commit.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Descargar los binarios sin firmar
        uses: actions/download-artifact@v4
        with:
          name: inyaguidiag-binaries
          path: dist

      # ------------------------------------------------------------------
      # PASO PENDIENTE DE CONFIGURACION
      #
      # Descomentar cuando SignPath Foundation apruebe el proyecto y
      # entregue los identificadores. Se pegan tal cual desde su panel;
      # SIGNPATH_API_TOKEN va como secreto del repositorio, nunca en el
      # archivo.
      # ------------------------------------------------------------------
      # - uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: <de SignPath>
      #     project-slug: inyaguidiag
      #     signing-policy-slug: release-signing
      #     github-artifact-id: inyaguidiag-binaries
      #     wait-for-completion: true
      #     output-artifact-directory: dist-firmado

      - name: Aviso mientras no este configurado
        shell: pwsh
        run: |
          Write-Host "::warning::Los binarios NO estan firmados. Falta configurar SignPath (ver docs/FIRMA.md)."
